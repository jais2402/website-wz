        - heading "Understand. Shape. Build. Run." [level=2] [ref=f10e230]
        - paragraph [ref=f10e231]: We don't start with technology. We start with the business.
        - generic [ref=f10e232]:
          - generic [ref=f10e233]:
            - paragraph [ref=f10e236]: "01"
            - heading "Understand" [level=3] [ref=f10e237]
            - paragraph [ref=f10e238]: We get inside the process. The people, workflows, systems, dependencies, exceptions, constraints and the outcome the business actually needs.
            - paragraph [ref=f10e239]: A clear picture of the problem.
          - generic [ref=f10e240]:
            - paragraph [ref=f10e243]: "02"
            - heading "Shape" [level=3] [ref=f10e244]
            - paragraph [ref=f10e245]: We turn the problem into a product. What matters now, what can wait, how it should work, and what the architecture has to support.
            - paragraph [ref=f10e246]: Scope, priorities, direction, timeline and price.
          - generic [ref=f10e247]:
            - paragraph [ref=f10e250]: "03"
            - heading "Build" [level=3] [ref=f10e251]
            - paragraph [ref=f10e252]: We design and develop in working pieces. The people who understand the project stay close to the build.
            - paragraph [ref=f10e253]: A working product you can test and review.
          - generic [ref=f10e254]:
            - paragraph [ref=f10e257]: "04"
            - heading "Run" [level=3] [ref=f10e258]
            - paragraph [ref=f10e259]: After launch we host, monitor, maintain, support and keep improving what we built.
            - paragraph [ref=f10e260]: A product that keeps serving the business.
