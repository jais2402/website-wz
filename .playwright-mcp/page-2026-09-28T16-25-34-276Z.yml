        - heading "Understand. Shape. Build. Run." [level=2] [ref=f3e230]
        - paragraph [ref=f3e231]: We don't start with technology. We start with the business.
        - generic [ref=f3e232]:
          - generic [ref=f3e233]:
            - paragraph [ref=f3e236]: "01"
            - heading "Understand" [level=3] [ref=f3e237]
            - paragraph [ref=f3e238]: We get inside the process. The people, workflows, systems, dependencies, exceptions, constraints and the outcome the business actually needs.
            - paragraph [ref=f3e239]: A clear picture of the problem.
          - generic [ref=f3e240]:
            - paragraph [ref=f3e243]: "02"
            - heading "Shape" [level=3] [ref=f3e244]
            - paragraph [ref=f3e245]: We turn the problem into a product. What matters now, what can wait, how it should work, and what the architecture has to support.
            - paragraph [ref=f3e246]: Scope, priorities, direction, timeline and price.
          - generic [ref=f3e247]:
            - paragraph [ref=f3e250]: "03"
            - heading "Build" [level=3] [ref=f3e251]
            - paragraph [ref=f3e252]: We design and develop in working pieces. The people who understand the project stay close to the build.
            - paragraph [ref=f3e253]: A working product you can test and review.
          - generic [ref=f3e254]:
            - paragraph [ref=f3e257]: "04"
            - heading "Run" [level=3] [ref=f3e258]
            - paragraph [ref=f3e259]: After launch we host, monitor, maintain, support and keep improving what we built.
            - paragraph [ref=f3e260]: A product that keeps serving the business.
