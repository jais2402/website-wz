        - heading "Priced on the system, once we understand it." [level=2] [ref=f13e264]
        - paragraph [ref=f13e265]: You see scope, price and timeline together, in writing, before anything is built. The number comes out of the Shape stage, once we understand your process — so it is priced on the system you actually need rather than on a rate card.
        - generic [ref=f13e266]:
          - generic [ref=f13e267]:
            - heading "Understand the system first" [level=3] [ref=f13e270]
            - paragraph [ref=f13e271]: We map how the work happens today and what the first version has to do.
          - generic [ref=f13e272]:
            - heading "Price the value and the build" [level=3] [ref=f13e275]
            - paragraph [ref=f13e276]: The price reflects the outcome the system delivers and the work it takes to build it properly.
          - generic [ref=f13e277]:
