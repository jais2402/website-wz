      - generic [ref=f13e229]:
        - heading "Understand. Shape. Build. Run." [level=2] [ref=f13e230]
        - paragraph [ref=f13e231]: We don't start with technology. We start with the business.
        - generic [ref=f13e232]:
          - generic [ref=f13e233]:
            - paragraph [ref=f13e236]: "01"
            - heading "Understand" [level=3] [ref=f13e237]
            - paragraph [ref=f13e238]: We get inside the process. The people, workflows, systems, dependencies, exceptions, constraints and the outcome the business actually needs.
            - paragraph [ref=f13e239]: A clear picture of the problem.
          - generic [ref=f13e240]:
            - paragraph [ref=f13e243]: "02"
            - heading "Shape" [level=3] [ref=f13e244]
            - paragraph [ref=f13e245]: We turn the problem into a product. What matters now, what can wait, how it should work, and what the architecture has to support.
            - paragraph [ref=f13e246]: Scope, priorities, direction, timeline and price.
          - generic [ref=f13e247]:
            - paragraph [ref=f13e250]: "03"
            - heading "Build" [level=3] [ref=f13e251]
            - paragraph [ref=f13e252]: We design and develop in working pieces. The people who understand the project stay close to the build.
            - paragraph [ref=f13e253]: A working product you can test and review.
          - generic [ref=f13e254]:
            - paragraph [ref=f13e257]: "04"
            - heading "Run" [level=3] [ref=f13e258]
            - paragraph [ref=f13e259]: After launch we host, monitor, maintain, support and keep improving what we built.
            - paragraph [ref=f13e260]: A product that keeps serving the business.
