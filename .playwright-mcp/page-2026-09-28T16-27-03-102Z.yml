            - paragraph [ref=f6e236]: "01"
            - heading "Understand" [level=3] [ref=f6e237]
            - paragraph [ref=f6e238]: We get inside the process. The people, workflows, systems, dependencies, exceptions, constraints and the outcome the business actually needs.
            - paragraph [ref=f6e239]: A clear picture of the problem.
          - generic [ref=f6e240]:
            - paragraph [ref=f6e243]: "02"
            - heading "Shape" [level=3] [ref=f6e244]
            - paragraph [ref=f6e245]: We turn the problem into a product. What matters now, what can wait, how it should work, and what the architecture has to support.
            - paragraph [ref=f6e246]: Scope, priorities, direction, timeline and price.
          - generic [ref=f6e247]:
            - paragraph [ref=f6e250]: "03"
            - heading "Build" [level=3] [ref=f6e251]
            - paragraph [ref=f6e252]: We design and develop in working pieces. The people who understand the project stay close to the build.
            - paragraph [ref=f6e253]: A working product you can test and review.
          - generic [ref=f6e254]:
            - paragraph [ref=f6e257]: "04"
            - heading "Run" [level=3] [ref=f6e258]
            - paragraph [ref=f6e259]: After launch we host, monitor, maintain, support and keep improving what we built.
            - paragraph [ref=f6e260]: A product that keeps serving the business.
