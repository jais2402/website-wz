        - heading "Understand. Shape. Build. Run." [level=2] [ref=f11e227]
        - paragraph [ref=f11e228]: We don't start with technology. We start with the business.
        - generic [ref=f11e229]:
          - generic [ref=f11e230]:
            - paragraph [ref=f11e233]: "01"
            - heading "Understand" [level=3] [ref=f11e234]
            - paragraph [ref=f11e235]: We get inside the process. The people, workflows, systems, dependencies, exceptions, constraints and the outcome the business actually needs.
            - paragraph [ref=f11e236]: A clear picture of the problem.
          - generic [ref=f11e237]:
            - paragraph [ref=f11e240]: "02"
            - heading "Shape" [level=3] [ref=f11e241]
            - paragraph [ref=f11e242]: We turn the problem into a product. What matters now, what can wait, how it should work, and what the architecture has to support.
            - paragraph [ref=f11e243]: Scope, priorities, direction, timeline and price.
          - generic [ref=f11e244]:
            - paragraph [ref=f11e247]: "03"
            - heading "Build" [level=3] [ref=f11e248]
            - paragraph [ref=f11e249]: We design and develop in working pieces. The people who understand the project stay close to the build.
            - paragraph [ref=f11e250]: A working product you can test and review.
          - generic [ref=f11e251]:
            - paragraph [ref=f11e254]: "04"
            - heading "Run" [level=3] [ref=f11e255]
            - paragraph [ref=f11e256]: After launch we host, monitor, maintain, support and keep improving what we built.
            - paragraph [ref=f11e257]: A product that keeps serving the business.
